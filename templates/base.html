{% import "components/ui.html" as ui with context %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Daftar Tugas Harian{% endblock %}</title>
  <link rel="icon" href="/static/favicon.ico">
  <meta name="description" content="Aplikasi pencatatan tugas harian dengan Kanban, daftar, kalender, dan Gantt. Studi kasus MagangHub CIMB Niaga.">

  <meta property="og:title" content="Daftar Tugas Harian">
  <meta property="og:description" content="Aplikasi pencatatan tugas harian dengan Kanban, daftar, kalender, dan Gantt. Studi kasus MagangHub CIMB Niaga.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ url_for('static', filename='og-image.png', _external=True) }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Daftar Tugas Harian">
  <meta name="twitter:description" content="Aplikasi pencatatan tugas harian dengan Kanban, daftar, kalender, dan Gantt. Studi kasus MagangHub CIMB Niaga.">
  <meta name="twitter:image" content="{{ url_for('static', filename='og-image.png', _external=True) }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/tailwind.css">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body class="min-h-screen bg-bg text-ink font-sans flex flex-col">
  <a href="#main-content" class="skip-link">Lewati ke konten utama</a>

  {% block navbar %}{% endblock %}

  <main id="main-content" class="flex-1 w-full bg-bg py-5" tabindex="-1">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col gap-5">
      <div class="flash-container">
        {{ ui.flash_messages() }}
      </div>
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
